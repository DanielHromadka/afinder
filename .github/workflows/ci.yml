# Checks for every pull request and push: the app (typecheck, lint, unit tests), the packages with their own
# dependencies (feedback Worker, phone relay, phone app) and the stable smoke tests in a real Electron.
# Releases (release.yml) run on main and repeat the app's checks before building.
name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [feedback, mobile/relay, mobile/app]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # A display for Electron, the libraries Chromium needs, and unprivileged user namespaces for its sandbox
      # (Ubuntu 24.04 restricts them through AppArmor).
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      # The smoke tests that need nothing outside the repository (no models, relay, Worker or Doom build).
      - name: Smoke tests
        run: |
          for test in tools docker workspace tour; do
            echo "::group::$test"
            xvfb-run -a npx electron scripts/smoke-$test.cjs
            echo "::endgroup::"
          done
