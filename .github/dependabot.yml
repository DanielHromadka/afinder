# Weekly dependency updates, minor and patch grouped into one PR per package so CI runs once.
# Majors come one by one. Electron majors need native module rebuilds (node-pty, onnxruntime) and Expo SDK upgrades
# go through `npx expo install --fix`, so those are done by hand. Every merge to main cuts a release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: electron
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directories: [/feedback, /mobile/relay]
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /mobile/app
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Expo pins these to the SDK; `npx expo install --fix` moves them together.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: react
      - dependency-name: react-dom

  - package-ecosystem: cargo
    directory: /native/afinder-input
    schedule: { interval: monthly }
    groups:
      all: { patterns: ['*'] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ['*'] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
