appId: cz.attosoft.afinder
productName: aFinder
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# node-pty loads a native addon and (on macOS) executes spawn-helper – neither works from inside app.asar.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/onnxruntime-node/**
# The "What's new" notes: [] in the repository, written by scripts/release-notes.mjs in the release workflow.
extraResources:
  - from: build/release-notes.json
    to: release-notes.json
# Keeps only the ONNX Runtime binaries of the platform being packaged.
afterPack: scripts/after-pack.cjs
# Chromium UI strings: only the languages aFinder itself is translated to (en, cs, de, es).
electronLanguages: [en, cs, de, es]
mac:
  icon: build/icon.png
  # Encryption only protects transfers (HTTPS, SSH, the phone link), which is exempt; App Store Connect stops
  # asking. Set here because the Info.plist comes from the mac options even for the mas target.
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
    # Lets LaunchServices make aFinder the folder handler (services/defaultApp.ts); Finder stays the default
    # until the user chooses aFinder.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.folder]
  category: public.app-category.utilities
  # Names the update .zip (the dmg sets its own): electron-updater picks the arm64 or x64 file by the arch in it.
  artifactName: ${productName}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    # The .zip is what electron-updater installs through Squirrel.Mac; the .dmg is for the first install.
    - target: zip
      arch: [arm64, x64]
# Mac App Store build (npm run dist:mas): sandboxed, signed with Apple Distribution, updated by the App
# Store. Everything else comes from mac; the disk access is granted at runtime (services/diskAccess.ts).
mas:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/aFinder_AppStore.provisionprofile
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mas.${ext}
  # Universal build: unpacked native modules carry binaries for both architectures (or load optionally, like ssh2).
  x64ArchFiles: Contents/Resources/app.asar.unpacked/**
# Local test of the sandboxed build, signed with Apple Development.
masDev:
  provisioningProfile: build/aFinder_Dev.provisionprofile
# File names carry no version, so /releases/latest/download/<name> always points at the newest build.
dmg:
  artifactName: ${productName}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Uninstalling gives folders back to Explorer (services/defaultApp.ts), so double-clicks never hit a missing exe.
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  synopsis: Windows XP style file manager
  maintainer: attosoft <danielhromadka1@gmail.com>
  vendor: attosoft
  syncDesktopName: true
  # AppImage runs anywhere (and updates itself); deb for Debian and Ubuntu, rpm for Fedora, RHEL/Alma/Rocky 9+
  # and openSUSE. CI builds x64 natively and cross-compiles arm64 (node-pty has no Linux prebuilds).
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
appImage:
  artifactName: ${productName}-${arch}.${ext}
# What Electron needs at runtime, so apt / dnf pull it in (minimal systems lack ALSA and GBM). Debian 13 and
# Ubuntu 24.04 renamed some libraries with a t64 suffix; it comes first, or apt satisfies "libasound2" with a
# fake ALSA (liboss4-salsa) that Electron cannot load.
deb:
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret
    - mesa-libgbm
    - alsa-lib
# Releases go to the public downloads repository; electron-updater reads latest.yml from there.
publish:
  provider: github
  owner: DanielHromadka
  repo: afinder-downloads
  releaseType: release
