<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Doom</title>
    <!-- The only page allowed to compile WebAssembly; it gets the bytes from the Games panel, never from the network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font: 13px system-ui, sans-serif; color: #fff; user-select: none; }
      canvas { aspect-ratio: 4 / 3; max-width: 100%; max-height: 100%; width: 100%; image-rendering: pixelated; }
      #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); cursor: pointer; }
      #veil[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas width="320" height="200"></canvas>
    <div id="veil" hidden></div>
    <script type="module" src="./src/doom/main.ts"></script>
  </body>
</html>
